<svg xmlns="http://www.w3.org/2000/svg" width="563" height="206" viewBox="0 0 563 206" role="img" aria-labelledby="title desc">
<title id="title">Invalid, NIS, ADC, ring out, hung up, and bounce email call flow</title><desc id="desc">Workflow for unsuccessful calls and bounced email, including CRM updates and notes.</desc>
