<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16232E;         /* deep bookcloth navy */
    --ink-2:#223343;       /* lighter panel navy */
    --paper:#EEEAE0;       /* parchment background */
    --paper-card:#FAF8F3;  /* card surface, slightly lighter than paper */
    --rule:#DAD3C2;        /* hairline rule on paper */
    --clay:#4B6E5E;        /* bookcloth green accent */
    --clay-dark:#3A5749;
    --gold:#A9822F;        /* foil gold, used sparingly */
    --ink-text:#20262B;
    --muted:#6B6355;
  }
  html{scroll-padding-top:1rem;}
  body{
    background:var(--paper);
    color:var(--ink-text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .font-display{font-family:'Source Serif 4',serif;}
  ::selection{background:var(--gold);color:#fff;}

  /* Sidebar */
  #sidebar{
    background:var(--ink);
    width:260px;
    transition:transform .25s ease, width .25s ease;
  }
  .nav-item{
    display:flex;align-items:center;gap:.75rem;
    padding:.65rem .9rem;border-radius:.5rem;
    color:#C7D0D6;font-size:.875rem;font-weight:500;
    border-left:3px solid transparent;
    cursor:pointer;transition:background .15s ease,color .15s ease;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff;}
  .nav-item.active{
    background:rgba(75,110,94,.28);
    color:#fff;
    border-left:3px solid var(--gold);
  }
  .nav-item svg{flex-shrink:0;width:18px;height:18px;}

  /* Cards */
  .paper-card{
    background:var(--paper-card);
    border:1px solid var(--rule);
    border-radius:.65rem;
  }
  .chip{
    display:flex;align-items:center;justify-content:space-between;gap:.5rem;
    padding:.5rem .75rem;border-radius:.4rem;
    border:1px solid var(--rule);background:#fff;
    font-size:.8125rem;color:var(--ink-text);
    transition:border-color .15s ease, transform .1s ease;
  }
  .chip:hover{border-color:var(--clay);transform:translateX(2px);}
  .badge-internal{
    font-size:.6875rem;font-weight:600;letter-spacing:.02em;
    color:#8A4A2B;background:#F3E3D6;border:1px solid #E6C8AE;
    padding:.1rem .45rem;border-radius:.3rem;
  }
  .tag{
    font-size:.6875rem;font-weight:600;padding:.15rem .5rem;border-radius:999px;
    border:1px solid transparent;
  }

  /* Accordion */
  .accordion-body{
    max-height:0;overflow:hidden;transition:max-height .3s ease;
  }
  .accordion-item.open > .accordion-body{max-height:800px;}
  .accordion-chevron{transition:transform .25s ease;}
  .accordion-item.open .accordion-chevron{transform:rotate(180deg);}

  /* Category collapse (Tab 1) */
  .cat-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .cat-item.open > .cat-body{max-height:2000px;}
  .cat-chevron{transition:transform .25s ease;}
  .cat-item.open .cat-chevron{transform:rotate(180deg);}

  /* Timeline */
  .timeline-line{position:absolute;left:15px;top:2.25rem;bottom:-1.5rem;width:2px;background:var(--rule);}
  .timeline-dot{
    width:32px;height:32px;border-radius:999px;background:var(--clay);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;
    font-family:'Source Serif 4',serif;flex-shrink:0;z-index:1;
  }

  /* copy toast */
  .toast{
    position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%) translateY(1rem);
    background:var(--ink);color:#fff;font-size:.8125rem;padding:.55rem 1rem;border-radius:.5rem;
    opacity:0;pointer-events:none;transition:opacity .2s ease, transform .2s ease;z-index:60;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  table.data-table th{
    cursor:pointer;user-select:none;font-family:'Source Serif 4',serif;
  }
  table.data-table th:hover{color:var(--clay-dark);}
  .sort-arrow{font-size:.65rem;opacity:.55;margin-left:.2rem;}

  .fade-hide{display:none !important;}

  #mobileOverlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;
  }
  @media (max-width:900px){
    #sidebar{
      position:fixed;top:0;left:0;bottom:0;z-index:50;
      transform:translateX(-100%);
    }
    #sidebar.mobile-open{transform:translateX(0);}
  }

  .video-thumb{
    aspect-ratio:16/9;background:linear-gradient(135deg,#223343,#16232E);
    display:flex;align-items:center;justify-content:center;border-radius:.6rem .6rem 0 0;
  }
</style>
</head>

/* =========================================================
   NAV + TAB SWITCHING
   ========================================================= */
let activeTab = 'resources';

function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = SECTIONS.map(s => `
    <div class="nav-item ${s.id===activeTab?'active':''}" data-tab="${s.id}" onclick="switchTab('${s.id}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${s.icon}</svg>
      <span>${s.label}</span>
    </div>`).join('');
}

function switchTab(id){
  activeTab = id;
  SECTIONS.forEach(s=>{
    document.getElementById('panel-'+s.id).classList.toggle('fade-hide', s.id!==id);
  });
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.tab===id);
  });
  const sec = SECTIONS.find(s=>s.id===id);
  document.getElementById('sectionTitle').textContent = sec.label;
  document.getElementById('sectionSub').textContent = sec.sub;
  document.querySelectorAll('#globalSearch, input[type="text"]').forEach(i=>{ if(i.id==='globalSearch') i.value=''; });
  handleSearch('');
  closeMobileNav();
}

function openMobileNav(){
  document.getElementById('sidebar').classList.add('mobile-open');
  document.getElementById('mobileOverlay').style.display='block';
}
function closeMobileNav(){
  document.getElementById('sidebar').classList.remove('mobile-open');
  document.getElementById('mobileOverlay').style.display='none';
}

/* =========================================================
   SEARCH (tab-aware, filters visible content)
   ========================================================= */
function handleSearch(qRaw){
  const q = qRaw.trim().toLowerCase();
  const root = document.getElementById('panel-'+activeTab);
  if(!root) return;
  root.querySelectorAll('[data-search]').forEach(el=>{
    const hay = el.getAttribute('data-search').toLowerCase();
    el.classList.toggle('fade-hide', q.length>0 && !hay.includes(q));
  });
}

/* =========================================================
   TOAST + COPY
   ========================================================= */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1500);
}
async function copyText(text, btn){
  try{
    await navigator.clipboard.writeText(text);
    showToast('Copied!');
    if(btn){
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(()=>{ btn.textContent = orig; }, 1500);
    }
  }catch(e){
    showToast('Could not copy');
  }
}

function openVideoModal(title){
  document.getElementById('videoModalTitle').textContent = title;
  const m = document.getElementById('videoModal');
  m.classList.remove('hidden'); m.classList.add('flex');
}
function closeVideoModal(){
  const m = document.getElementById('videoModal');
  m.classList.add('hidden'); m.classList.remove('flex');
}
