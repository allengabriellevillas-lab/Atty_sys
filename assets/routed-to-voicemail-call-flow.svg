<svg xmlns="http://www.w3.org/2000/svg" width="562" height="250" viewBox="0 0 562 250" role="img" aria-labelledby="title desc">
<title id="title">Routed to voicemail call flow</title><desc id="desc">Pre-call preparations lead to first call attempt, leaving voicemail, sending an unresponsive-phone template, a second call attempt, and updating the open call task and lead notes.</desc>
<defs><marker id="blue-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6z" fill="#407ff2"/></marker><marker id="red-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 8 3 0 6z" fill="#f00000"/></marker><style>text{font-family:Arial,sans-serif;fill:#111;font-size:11px}.box{stroke:#555;stroke-width:1}.arrow-blue{fill:none;stroke:#407ff2;stroke-width:1.4;marker-end:url(#blue-arrow)}.arrow-red{fill:none;stroke:#f00000;stroke-width:1.4;marker-end:url(#red-arrow)}</style></defs>
<rect class="box" x="2" y="15" width="112" height="63" fill="#dcebd7"/><text x="58" y="42" text-anchor="middle">PRE-CALL</text><text x="58" y="57" text-anchor="middle">PREPARATIONS</text>
<rect class="box" x="154" y="15" width="108" height="63" fill="#d8e1e5"/><text x="208" y="42" text-anchor="middle">1ST CALL</text><text x="208" y="57" text-anchor="middle">ATTEMPT</text>
<rect class="box" x="302" y="15" width="108" height="63" fill="#c9dce1"/><text x="356" y="42" text-anchor="middle">LEAVE</text><text x="356" y="57" text-anchor="middle">VOICEMAIL</text>
<rect class="box" x="450" y="15" width="107" height="63" fill="#fff3ca"/><text x="503.5" y="30" text-anchor="middle">SEND</text><text x="503.5" y="44" text-anchor="middle">UNRESPONSIVE-</text><text x="503.5" y="58" text-anchor="middle">PHONE</text><text x="503.5" y="72" text-anchor="middle">TEMPLATE</text>
<path class="arrow-blue" d="M114 46h39"/><path class="arrow-red" d="M262 46h39"/><path class="arrow-blue" d="M410 46h39"/>
<rect class="box" x="154" y="98" width="108" height="62" fill="#d8e1e5"/><text x="208" y="124" text-anchor="middle">2ND CALL</text><text x="208" y="139" text-anchor="middle">ATTEMPT</text><path class="arrow-red" d="M208 78v20"/><path class="arrow-red" d="M262 129h94V79"/>
<rect class="box" x="154" y="171" width="108" height="33" fill="#fff3ca"/><text x="208" y="191" text-anchor="middle">EMAIL BOUNCED</text><path class="arrow-blue" d="M208 204v16h124v-43h67"/><path d="M262 187 503 78" fill="none" stroke="#f00000" stroke-width="1.2" stroke-dasharray="5 4"/>
<rect class="box" x="400" y="145" width="156" height="96" fill="#dcebd7"/><text x="418" y="158">&#8226;</text><text x="434" y="158">TICK OFF OPEN CALL</text><text x="434" y="170">TASK</text><text x="418" y="183">&#8226;</text><text x="434" y="183">CHANGE THE LEAD</text><text x="434" y="195">STATUS TO</text><text x="434" y="207">&#8216;ATTEMPTED&#8217;</text><text x="418" y="220">&#8226;</text><text x="434" y="220">LEAVE NOTES: &#8216;LVM OR</text><text x="434" y="234">LMOM&#8217;</text><path class="arrow-blue" d="M503 78 480 144"/>
</svg>